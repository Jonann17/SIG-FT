# Portao de qualidade de todo commit: lint + suite de testes.
#
# Roda em LINUX de proposito. E ~3x mais rapido e mais barato que o Windows, e
# o que a suite exercita (core/, services/, os guards de AST) nao tem nada de
# especifico do sistema -- as dependencias pesadas sao dubladas por
# tests/conftest.py. O que so existe no Windows (WinHTTP/PAC, mutex, Inno
# Setup, PyInstaller) e exercitado no workflow de Release, que roda no
# windows-latest de verdade.
#
# ⚠️ Verde aqui NAO e prova de portal. Os testes rodam contra dubles escritos
# pelo proprio Claude: eles provam a ideia do portal, nao o portal. Ver o
# CLAUDE.md e docs/PORTAL_COMO_ELE_SE_COMPORTA.md.
name: CI

on:
  push:
    branches: ["claude/**", "main"]
  pull_request:

# O portao so LE o repositorio. Nada aqui publica nada.
permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Mesmo motivo do workflow de Release: um `print` com acento num teste
      # ou num script morreria por UnicodeEncodeError. Aqui e barato ligar.
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.10 e o MINIMO que o SIG-FT.bat aceita, e o alvo do ruff/mypy no
          # pyproject.toml. Testar no minimo e o que pega uso de sintaxe nova
          # por engano; a maquina do usuario pode estar exatamente nele.
          python-version: "3.10"
          cache: pip

      # A suite roda SEM as dependencias pesadas (pandas, playwright,
      # google-generativeai...): tests/conftest.py as dubla. Instalar tudo aqui
      # seria minutos de CI para exercitar o mesmo codigo.
      #
      # Duas escapam da dublagem e precisam ser reais:
      #   python-dotenv  -- `sigft/app/main.py` a importa no topo, e
      #                     tests/test_app_recursos.py importa esse modulo;
      #   pillow         -- idem, pelo `PIL.Image` do splash.
      # Sem as duas sao 3 falhas que NAO sao defeito do codigo. Medido.
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install python-dotenv pillow

      # `compileall` cobre o que o pytest nao importa -- inclusive o
      # frontend.py, que abre janela real e por isso nao pode ser importado.
      - name: Sintaxe (compileall)
        run: python -m compileall -q .

      # pyflakes e a UNICA checagem que enxerga nome indefinido no
      # frontend.py. Ver o defeito de 2026-08-25 no CLAUDE.md: compileall
      # passou, 2625 testes passaram, e o app morria na abertura.
      - name: Nome indefinido no frontend.py (pyflakes)
        run: python -m pyflakes frontend.py

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Testes (pytest)
        run: python -m pytest -q

      # Erro no CHANGELOG so apareceria na hora de publicar, com a tag ja
      # criada -- e desfazer isso exige apagar o Release e a tag. Aqui aparece
      # no commit. O teste equivalente ja existe em tests/test_novidades.py;
      # este passo repete a checagem com uma mensagem de acao clara.
      - name: Conferir o CHANGELOG da versao atual
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from sigft._build_info import VERSAO
          from sigft.core.novidades import analisar, bloco_de

          texto = open("CHANGELOG.md", encoding="utf-8").read()
          blocos = analisar(texto)
          if not blocos:
              sys.exit("CHANGELOG.md nao tem nenhum bloco '## <versao>' reconhecivel.")
          if bloco_de(texto, VERSAO) is None:
              sys.exit(f"_build_info.VERSAO e {VERSAO}, mas o CHANGELOG.md nao tem "
                       f"bloco para ela. O Release sairia SEM notas -- acrescente "
                       f"'## {VERSAO} - <data>' antes de criar a tag.")
          print(f"CHANGELOG ok: {len(blocos)} versao(oes), a mais recente e a "
                f"v{blocos[0].versao}.")
          PY
