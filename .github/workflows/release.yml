# ════════════════════════════════════════════════════════════════════════════
#  Release do SIG-FT Itaipu -- build + instalador + publicacao
#
#  COMO SE LANCA UMA VERSAO (e so isto):
#     1. acrescente o bloco da versao no CHANGELOG.md e faca commit;
#     2. git tag v1.0.1 && git push origin v1.0.1
#
#  O resto acontece aqui: o Windows da GitHub gera o .exe com o PyInstaller,
#  monta o instalador com o Inno Setup, calcula o SHA256 e publica o Release.
#  Os apps ja instalados avisam sozinhos na proxima abertura.
#
#  SEM PERMISSAO DE TAG? Use o botao "Run workflow", campo "versao". Por esse
#  caminho quem cria a tag e o proprio runner, com o GITHUB_TOKEN.
#
#  SEGREDO NECESSARIO (Settings -> Secrets and variables -> Actions):
#     UPDATE_TOKEN -- PAT fine-grained, SOMENTE LEITURA (Contents: Read-only),
#                     restrito a ESTE repositorio. E ele que o app embute para
#                     conseguir ler os Releases, ja que o repositorio e
#                     PRIVADO. Sem o segredo o build sai sem atualizacao
#                     automatica (e o workflow avisa) -- nada quebra.
#  Ver docs/BUILD.md, secao "Rotacao do token".
# ════════════════════════════════════════════════════════════════════════════
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      versao:
        description: "Versao a publicar, sem o 'v' (ex.: 1.0.1, ou 1.1.0-rc.1 para testar)"
        required: true
        type: string
      prerelease:
        description: "Pre-lancamento (o app NAO oferece pre-lancamentos como atualizacao). Desmarque para publicar de verdade."
        required: false
        default: true
        type: boolean

permissions:
  contents: write        # necessario para criar o Release e subir os assets

jobs:
  build:
    runs-on: windows-latest        # o PyInstaller nao faz compilacao cruzada
    timeout-minutes: 90            # o pacote do SIG-FT passa de 400 MB

    env:
      # ARMADILHA N. 1: o Windows roda o Python em cp1252 por padrao, e
      # qualquer `print` com acento derruba o passo com UnicodeEncodeError --
      # o build morre por causa de uma MENSAGEM, depois de lint e testes ja
      # terem passado. PYTHONUTF8=1 liga o modo UTF-8 para o job inteiro.
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # A versao sai da TAG (v1.0.1 -> 1.0.1) ou do campo do botao. A decisao
      # mora num SCRIPT, e nao aqui, porque logica em YAML nao tem teste -- e
      # a primeira versao dela, escrita aqui, publicava `v1.0.0-rc.1` como
      # release NORMAL. Ver tools/versao_do_release.py e
      # tests/test_versao_do_release.py.
      - name: Definir a versao
        id: versao
        shell: bash
        run: |
          python tools/versao_do_release.py \
            --evento "${{ github.event_name }}" \
            --ref "${GITHUB_REF_NAME:-}" \
            --entrada-versao "${{ inputs.versao }}" \
            --entrada-prerelease "${{ inputs.prerelease }}"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install "pyinstaller>=6,<7"

      # O modelo do tradutor local da tela 4.2 (~218 MB). ANTES dos testes, para
      # que os testes com o modelo de verdade (tests/test_tradutor_local.py)
      # rodem aqui, no Windows; e antes do PyInstaller, que o embute. A
      # conversao precisa de torch + transformers (~200 MB), por isso o cache:
      # a revisao do modelo e fixa no script, entao a chave pelo hash dele so
      # muda quando alguem muda a revisao de proposito.
      - name: Cache do modelo do tradutor
        id: cache-tradutor
        uses: actions/cache@v4
        with:
          path: recursos/tradutor_pt_es
          key: tradutor-pt-es-${{ hashFiles('tools/preparar_tradutor.py') }}

      # A conversao roda num venv SEPARADO: o torch nem chega ao ambiente do
      # PyInstaller (o `ctranslate2.converters` tenta importa-lo, e ele iria
      # para o instalador). O SIG-FT.spec tambem o exclui, por garantia.
      - name: Preparar o tradutor local (modelo embutido)
        shell: bash
        run: |
          if ! python tools/preparar_tradutor.py --verificar; then
            python -m venv "$RUNNER_TEMP/venv-tradutor"
            CONVERSOR="$RUNNER_TEMP/venv-tradutor/Scripts/python.exe"
            "$CONVERSOR" -m pip install --upgrade pip
            "$CONVERSOR" -m pip install torch --index-url https://download.pytorch.org/whl/cpu
            "$CONVERSOR" -m pip install ctranslate2 sentencepiece huggingface_hub "transformers<5"
            "$CONVERSOR" tools/preparar_tradutor.py
          fi
          python tools/preparar_tradutor.py --verificar

      # PORTAO RAPIDO: 2 minutos de teste antes de gastar 20 no empacotamento.
      # Uma versao publicada quebrada e MUITO mais cara de desfazer -- exige
      # apagar o Release e a tag, e quem ja atualizou ja atualizou.
      - name: Lint e testes
        run: |
          python -m ruff check .
          python -m pyflakes frontend.py
          python -m pytest -q

      - name: Carimbar versao e embutir o token
        id: carimbo
        shell: bash
        env:
          SIGFT_UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: |
          python tools/preparar_build.py "${{ steps.versao.outputs.versao }}" \
            --origem github-actions --commit "${{ github.sha }}"
          # `secrets` nao e contexto valido em `if:` de passo -- por isso a
          # presenca do token vira um output aqui.
          if [ -z "$SIGFT_UPDATE_TOKEN" ]; then
            echo "tem_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "tem_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Avisar se o token nao esta configurado
        if: steps.carimbo.outputs.tem_token == 'false'
        run: |
          echo "::warning title=Sem UPDATE_TOKEN::O segredo UPDATE_TOKEN nao esta definido. Este build NAO tera atualizacao automatica - quem instalar precisara baixar as proximas versoes a mao. Veja a secao 'Rotacao do token' do docs/BUILD.md."

      - name: Gerar o executavel (PyInstaller)
        run: pyinstaller SIG-FT.spec --noconfirm --clean

      # ─── As tres conferencias, e o que cada uma pega ──────────────────────

      - name: Conferir que o pacote ficou completo
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\SIG-FT\SIG-FT.exe")) {
            throw "o PyInstaller terminou sem gerar o SIG-FT.exe"
          }
          # O `assets/` e lido por `resource_path` em tempo de execucao: sem
          # ele o app abre sem identidade visual e so avisa no console.
          if (-not (Test-Path "dist\SIG-FT\_internal\assets\logo.png")) {
            Write-Host "::warning::assets/logo.png nao entrou no bundle."
          }
          # A Qt vai sob a LGPLv3, que exige o aviso e os textos da LGPL e da GPL
          # junto com o programa (E6.2). Sem eles o pacote nao sai. Ver
          # empacotamento/licencas/ e a secao "A interface Qt" do SIG-FT.spec.
          foreach ($licenca in "LEIA-ME-Qt.txt", "LGPL-3.0.txt", "GPL-3.0.txt") {
            if (-not (Test-Path "dist\SIG-FT\_internal\licencas\$licenca")) {
              throw "a licenca do Qt nao entrou no pacote: _internal\licencas\$licenca"
            }
          }
          Get-Item "dist\SIG-FT\SIG-FT.exe" | Format-List Name, Length

      # A conferencia que responde "o aplicativo consegue IMPORTAR?", que e a
      # pergunta certa -- modulo Python puro NAO vira pasta em `_internal\`, e
      # uma checagem por arquivo reprovaria um build bom.
      #
      # Desde a E6.2 ela tambem CARREGA a Qt (`conferir_qt`): importa o QtCore,
      # o QtGui e o QtWidgets de verdade, carrega o plugin da plataforma
      # `windows` e confere o estilo nativo, a traducao pt_BR e as fontes. E o
      # que transforma "falta o qwindows.dll" numa linha FALHA aqui, em vez de
      # uma caixa modal do Qt pendurando o passo --smoke abaixo.
      #
      # ARMADILHA DO `console=False`: o .exe nao se prende ao terminal, entao
      # nem a saida nem o $LASTEXITCODE chegam por uma chamada com `&`. Por
      # isso Start-Process -Wait -PassThru, e por isso o proprio programa grava
      # o relatorio num .txt que lemos aqui.
      - name: O .exe consegue importar o que precisa (--conferir-pacote)
        # Se o .exe ABRIR A JANELA em vez de responder a flag, este passo nao
        # falha: ele PENDURA, porque o `-Wait` espera um aplicativo que esta la,
        # aberto, esperando o usuario. Foi o que aconteceu em 2026-09-21, e sem
        # este limite o job consumiria os 90 minutos inteiros para nao publicar
        # nada. Com ele, o sintoma vira uma falha em 5 minutos, com nome.
        timeout-minutes: 5
        shell: pwsh
        run: |
          $p = Start-Process "dist\SIG-FT\SIG-FT.exe" -ArgumentList "--conferir-pacote" `
                             -PassThru -Wait -WorkingDirectory "$PWD"
          if (Test-Path "conferencia-do-pacote.txt") {
            Get-Content "conferencia-do-pacote.txt" | Write-Host
          }
          if ($p.ExitCode -ne 0) {
            throw "faltam modulos no pacote (codigo $($p.ExitCode)) - veja o relatorio acima"
          }

      # A checagem que o CLAUDE.md pedia e nenhum CI em Linux podia fazer:
      # ABRIR O APP. Em 2026-08-25 o CP 5.5 deixou um widget orfao, compileall
      # passou, 2625 testes passaram, e o app morria na abertura com NameError.
      # Desde a E6.1 a janela e a da Qt, e o --smoke visita TODAS as telas (elas
      # nascem na primeira visita): tela que nao abre reprova, com o nome.
      - name: A janela principal monta (--smoke)
        # Se o .exe ABRIR A JANELA em vez de responder a flag, este passo nao
        # falha: ele PENDURA, porque o `-Wait` espera um aplicativo que esta la,
        # aberto, esperando o usuario. Foi o que aconteceu em 2026-09-21, e sem
        # este limite o job consumiria os 90 minutos inteiros para nao publicar
        # nada. Com ele, o sintoma vira uma falha em 5 minutos, com nome.
        timeout-minutes: 5
        shell: pwsh
        run: |
          $p = Start-Process "dist\SIG-FT\SIG-FT.exe" -ArgumentList "--smoke" `
                             -PassThru -Wait -WorkingDirectory "$PWD"
          # O .exe usa `console=False`: o que ele imprime NAO chega aqui. O
          # motivo da falha vem pelo arquivo, ou nao vem -- e no run #3 de
          # 2026-09-21 este passo reprovou com "codigo 1" e mais nada.
          if (Test-Path "conferencia-da-janela.txt") {
            Get-Content "conferencia-da-janela.txt" | Write-Host
          } else {
            Write-Host "(o .exe nao gravou o conferencia-da-janela.txt -- ele morreu antes de chegar ao relato)"
          }
          if ($p.ExitCode -ne 0) {
            throw "o .exe nao conseguiu montar a janela principal (codigo $($p.ExitCode)) - veja o relatorio acima"
          }

      # ─── Instalador ───────────────────────────────────────────────────────

      # O Inno Setup ja vem na imagem windows-latest; o fallback cobre a
      # eventualidade de a imagem mudar sem quebrar o release.
      - name: Garantir o Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup nao encontrado na imagem - instalando via Chocolatey."
            choco install innosetup --no-progress -y
          }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Montar o instalador
        shell: pwsh
        run: |
          & "$env:ISCC" "/DMyAppVersion=${{ steps.versao.outputs.versao }}" `
                        "/DMyVersionInfo=${{ steps.versao.outputs.numerica }}" `
                        installer\sigft.iss
          $origem = "installer/Output/SIG-FT_Itaipu_Setup.exe"
          if (-not (Test-Path $origem)) { throw "o Inno Setup nao gerou o instalador." }
          # Nome com a versao: nos Downloads de quem baixa, "Setup.exe" sozinho
          # nao diz nada e os arquivos se sobrescrevem. Barras normais de
          # proposito: o passo que publica o Release roda em bash.
          $destino = "installer/Output/SIG-FT_Itaipu_Setup_${{ steps.versao.outputs.versao }}.exe"
          Move-Item $origem $destino -Force
          "INSTALADOR=$destino" | Out-File -FilePath $env:GITHUB_ENV -Append

      # O manifesto (que o app le para conferir o SHA256 antes de instalar) e
      # as notas do Release saem do MESMO script: ele le o CHANGELOG, calcula o
      # hash e grava os dois em UTF-8 sem BOM. Fazer isso em PowerShell tem
      # tres armadilhas (encoding, tipo e BOM) -- ver o docstring do script.
      - name: Gerar o manifesto e as notas do Release
        shell: bash
        run: |
          python tools/gerar_manifesto.py \
            --instalador "$INSTALADOR" \
            --versao "${{ steps.versao.outputs.versao }}" \
            --tag "${{ steps.versao.outputs.tag }}"

      # ─── Atualizacao so com o que mudou  [2026-10-07] ──────────────────────
      # O `arquivos.json` (cada arquivo instalado, com SHA256) vai para o
      # Release e e a BASE da proxima versao. Contra o das versoes anteriores
      # (as 3 mais recentes que o publicaram, e a ultima normal sempre), o
      # tools/gerar_atualizacao.py monta um instalador PEQUENO por base -- o
      # mesmo installer/sigft.iss em modo atualizacao -- e o registra no
      # latest.json, de onde o app escolhe o arquivo. Logica no script, e nao
      # aqui, pela razao de sempre: YAML nao tem teste
      # (tests/test_gerar_atualizacao.py). Pequeno que nao compensa ou nao
      # compila vira aviso: o completo ja esta pronto e serve para todo mundo.
      # Spec: docs/superpowers/specs/2026-10-07-atualizacao-incremental-design.md
      - name: Manifesto de arquivos e instaladores pequenos
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.versao.outputs.tag }}
        shell: bash
        run: |
          python tools/gerar_atualizacao.py manifesto --pasta dist/SIG-FT --changelog CHANGELOG.md \
            --versao "${{ steps.versao.outputs.versao }}" --saida arquivos.json
          gh api "repos/${{ github.repository }}/releases?per_page=30" > releases_anteriores.json
          mkdir -p bases
          for base in $(python tools/gerar_atualizacao.py escolher-bases \
                          --releases releases_anteriores.json --tag-atual "$TAG"); do
            gh release download "$base" -p arquivos.json -O "bases/$base.json" \
              || echo "::warning::nao consegui baixar o arquivos.json de $base"
          done
          python tools/gerar_atualizacao.py pacotes --bases bases \
            --versao "${{ steps.versao.outputs.versao }}" \
            --numerica "${{ steps.versao.outputs.numerica }}" --iscc "$ISCC"

      - name: Publicar o Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.versao.outputs.tag }}
          VERSAO: ${{ steps.versao.outputs.versao }}
          PRERELEASE: ${{ steps.versao.outputs.prerelease }}
        shell: bash
        run: |
          ativos=("$INSTALADOR#Instalador do SIG-FT Itaipu"
                  "latest.json#Manifesto (versao + SHA256)"
                  "arquivos.json#Arquivos desta versao (base da atualizacao pequena)")
          # `.bin`, e nao `.exe`: o app 1.1.1 baixa o primeiro .exe do Release.
          for pacote in installer/Output/*.bin; do
            [ -e "$pacote" ] && ativos+=("$pacote#Atualizacao pequena (so o que mudou)")
          done
          if [ "$PRERELEASE" = "true" ]; then sinal="--prerelease"; else sinal="--prerelease=false"; fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "O release $TAG ja existe - anexando os arquivos a ele."
            gh release upload "$TAG" "${ativos[@]}" --clobber
            gh release edit "$TAG" \
              --title "SIG-FT Itaipu v$VERSAO" \
              --notes-file notas_release.md "$sinal"
          else
            echo "Criando o release $TAG."
            # --target: a tag, quando ainda nao existe, nasce apontando para
            # ESTE commit -- e nao para o topo da branch padrao no momento.
            gh release create "$TAG" "${ativos[@]}" \
              --target "${{ github.sha }}" \
              --title "SIG-FT Itaipu v$VERSAO" \
              --notes-file notas_release.md "$sinal"
          fi
          echo "--- publicado ---"
          gh release view "$TAG"

      # Guardado por 30 dias: os manifestos e as conferencias, para diagnostico.
      #
      # [2026-10-07] SEM o instalador. Cada run guardava os ~300 MB dele (que ja
      # estao no proprio Release), a cota de artefatos da conta lotou, e o
      # passo derrubou o job da 1.2.0-rc.2 DEPOIS de publicar -- de quebra, o
      # job vermelho fez o cache do modelo do tradutor nao ser salvo. Agora o
      # instalador so vai para artefato quando o Release NAO saiu (passo de
      # baixo), e nenhum dos dois reprova o job: e copia de seguranca, nao
      # entrega.
      - name: Guardar os artefatos do build
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SIG-FT-${{ steps.versao.outputs.versao }}
          path: |
            latest.json
            arquivos.json
            conferencia-do-pacote.txt
            conferencia-da-janela.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Guardar o instalador quando o Release nao saiu
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SIG-FT-${{ steps.versao.outputs.versao }}-instalador
          path: |
            installer/Output/*.exe
            installer/Output/*.bin
          retention-days: 7
          if-no-files-found: warn
