# Configuração de ferramentas do SIG-FT.
#
# Este arquivo NÃO declara o pacote (não há build/instalação: o app roda da
# própria pasta, via SIG-FT.bat). Ele existe só para configurar o `ruff`
# (CP 8.1) e o `mypy` (CP 8.2) do plano de refatoração.

# =============================================================================
# ruff — Checkpoint 8.1
# =============================================================================
[tool.ruff]
target-version = "py310"       # o SIG-FT.bat exige Python 3.10+
line-length = 120

exclude = [
    # Skills de terceiros, vendorizadas para os dois desenvolvedores terem as
    # mesmas ferramentas (ver .claude/skills/VENDOR.md). Nao e codigo do
    # projeto: lintar aqui so gera ruido que ninguem tem autoridade para
    # corrigir, e o conserto some na proxima atualizacao do upstream.
    ".claude",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "dados_de_teste",
    # Cofre da gestao dos sobressalentes (PR #2): notas e scripts de REFERENCIA
    # que rodam na maquina do Luan, contra o Box. Nao e codigo do app -- o que
    # o SIG-FT precisa dali e portado para `sigft/`, e e la que o lint vale.
    # Lintar aqui deixava o CI vermelho por aviso em script que o app nunca
    # importa.
    "gestao-sobressalentes",
]

[tool.ruff.lint]
# A seleção é deliberadamente ESTREITA, e a razão importa.
#
# Rodar o ruff com o conjunto largo neste projeto acusa ~1.100 ocorrências, e
# a esmagadora maioria não é defeito: são 174 `E701` (dois comandos na mesma
# linha, `self.console.insert(...); self.console.see(...)`), 89 `E741` (nomes
# curtos como `l`), 81 `I001` (ordem dos imports). Endireitar isso tocaria
# quase todo arquivo do repositório — exatamente a "reformatação em massa"
# que o CLAUDE.md proíbe sem combinar antes, porque transforma merge trivial
# em conflito gigante, e há uma segunda frente de trabalho no repositório.
#
# Lint que acusa mil coisas é lint que se desliga. Então aqui ele acusa só o
# que quebra:
#
#   E9  erros de sintaxe/IO que impedem o arquivo de rodar
#   F   pyflakes: nome indefinido, import não usado, variável morta
#   B   bugbear: os defeitos de verdade (captura de variável de loop, default
#       mutável, `except` que engole a causa)
#
# Ampliar a seleção depois é uma decisão de projeto, não uma correção de
# carona — e deve vir junto com a combinação sobre quando reformatar.
select = ["E9", "F", "B"]

ignore = [
    # `zip(a, b)` sem `strict=`. É legítimo, mas exigir `strict` em todo zip
    # muda comportamento (passa a levantar em tamanhos diferentes) e nenhum
    # dos 5 casos daqui tem esse risco: os pares vêm da mesma origem.
    "B905",
]

[tool.ruff.lint.per-file-ignores]
# Os testes usam `assert False` de propósito em caminhos que não deveriam ser
# alcançados, e variáveis de laço não usadas em parametrização.
"tests/*" = ["B011", "B007"]

# =============================================================================
# mypy — Checkpoint 8.2
# =============================================================================
[tool.mypy]
python_version = "3.10"
# "Leniente" é o que o CP 8.2 pede, e não preguiça: o projeto tem 12 backends
# sem anotação nenhuma, e exigir tipagem estrita neles de uma vez pararia a
# refatoração para escrever `Any` em toda parte. A régua sobe quando as APIs
# públicas de `core/` estiverem anotadas.
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_configs = true
# Sem `disallow_untyped_defs`: função sem anotação continua válida.

[[tool.mypy.overrides]]
# `numpy` (via pandas) TEM stubs, e eles usam sintaxe de Python 3.12 (`type X =`).
# Com `python_version = "3.10"` o mypy recusa o stub e para tudo com
# "errors prevented further checking" — sem nunca chegar ao nosso código.
#
# `follow_imports = "skip"` faz ele tratar numpy como opaco em vez de tentar
# analisá-lo. Manter o alvo em 3.10 importa mais: é a versão mínima que o
# SIG-FT.bat aceita, e é ela que precisa ser verificada.
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# As dependências pesadas sem stubs. A lista cobre o que os SERVIÇOS importam
# — `core/` toca poucas delas de propósito (é o princípio nº 3 e nº 4 da
# arquitetura: só `PMIBPortal` conhece o motor de RPA, só `LLMClient` conhece
# o SDK de IA), e por isso o mypy avisa que várias entradas ficam sem uso ao
# rodar só em `core/`. Elas passam a valer quando a checagem chegar em
# `services/`.
module = [
    "playwright.*",
    "openpyxl.*",
    "pandas.*",
    "xlwings.*",
    "google.generativeai.*",
    "deep_translator.*",
    "unidecode.*",
    "llama_parse.*",
    "fitz.*",
    "PyPDF2.*",
    "bs4.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `core/rpa/portal.py` — os 32 avisos aqui são todos `union-attr` sobre
# `self.engine`, declarado `RPAEngine | None`.
#
# O aviso é LEGÍTIMO e não está sendo negado: se `engine` for None, o acesso
# estoura. O que o mypy não sabe é o que o docstring do módulo já registra —
# `PMIBPortal(engine=None)` é uso previsto, para as duas classes que só
# precisam da parte do portal que não toca o navegador; elas nunca chamam
# estes métodos.
#
# A correção certa (uma propriedade que valide e dê mensagem clara em vez de
# `AttributeError: 'NoneType'`) mexeria em 32 acessos de um módulo de RPA
# validado contra o portal REAL nas Fases 5 e 6. O CLAUDE.md é explícito:
# "nada de RPA se declara pronto sem uma execução real", e esta sessão não
# tem o portal. Trocar 32 acessos às cegas para satisfazer um lint é
# exatamente a troca ruim.
#
# Registrado em PENDENCIAS.md com o conserto proposto, para uma sessão local
# com o portal aberto.
module = ["sigft.core.rpa.portal"]
disable_error_code = ["union-attr"]

[[tool.mypy.overrides]]
# `core/rpa/playwright_engine.py` — os 19 avisos são todos a MESMA linha: um
# `**opcoes` (dict montado em tempo de execução) repassado a
# `launch_persistent_context`. O mypy tenta casar o dict contra cada um dos
# ~19 parâmetros da assinatura e reclama de todos.
#
# Não é defeito do nosso código nem do stub: é a limitação conhecida de
# `**kwargs` dinâmico contra assinatura fixa. Tipar isso exigiria um
# `TypedDict` espelhando a API do Playwright — que passaria a quebrar a cada
# atualização do pacote, sem nunca ter pegado um bug.
module = ["sigft.core.rpa.playwright_engine"]
disable_error_code = ["arg-type"]
