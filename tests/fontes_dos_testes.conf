<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Fontconfig dos testes (só Linux; `tests/conftest.py` aponta FONTCONFIG_FILE
     para cá, se ninguém já apontou). Tudo do sistema, MENOS as famílias que o
     app traz em assets/fonts: o Roboto e o Noto Emoji que valem nos testes são
     os que `estilo.carregar_fontes()` registra, como no app instalado. Um
     Roboto-Medium no ~/.fonts deixava o negrito 2 px mais largo que no app
     (ver tests/test_qt_fontes_dos_testes.py). -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <selectfont>
    <rejectfont>
      <pattern><patelt name="family"><string>Roboto</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Emoji</string></patelt></pattern>
    </rejectfont>
  </selectfont>
</fontconfig>
